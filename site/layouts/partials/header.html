<header class="top">
  <div class="wrap bar">
    <a class="brand" href="/"><span class="logo" aria-hidden="true">✓</span>OpenRBAC <span class="ver">{{ site.Params.version }} draft</span></a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Menu">
    <label for="nav-toggle" class="burger" aria-hidden="true"><span></span></label>
    <nav aria-label="Main">
      {{ $cur := . }}
      {{ range site.Menus.main }}<a href="{{ .URL }}"{{ if $cur.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
    </nav>
  </div>
</header>
