baseURL = "https://openrbac.com/"
languageCode = "en-us"
title = "OpenRBAC"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true

[params]
  description = "An open format for apps to publish the permissions they understand, so identity providers can grant them."
  repo = "https://github.com/OpenRBAC/spec"
  version = "0.1"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

